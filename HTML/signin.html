<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Inscription - Frigo Anti-Gaspi</title>
    <link rel="stylesheet" href="../CSS/templatesLogin.css" />
  </head>
  <body>
    <div class="formulaire-login">
      <div class="divLogo">
        <img src="../images/fridge.png" alt="Logo site" class="logo" />
      </div>
      <h1>Frigo Anti-Gaspi</h1>
      <p class="WelcomeMessage">Créez votre compte</p>
      <hr />
      <form>
        <label>Nom et prénom</label>
        <input type="text" placeholder="Nom et prénom" required /><br />
        <label>Email</label>
        <input type="email" placeholder="Email" required /><br />
        <label>Mot de passe</label>
        <input type="password" placeholder="Mot de passe" required /><br />
        <label>Confirmation mot de passe</label>
        <input
          type="password"
          placeholder="Confirmez votre mot de passe"
          required
        /><br />
        <button type="submit">S'inscrire</button>
        <p class="errorMessage">Une erreur est survenue, veuillez réessayer.</p>
      </form>
    </div>
    <footer>
      <p>&copy; Frigo Anti-Gaspi</p>
    </footer>
  </body>
</html>
