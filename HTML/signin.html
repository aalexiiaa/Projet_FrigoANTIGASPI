<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Inscription - Frigo Anti-Gaspi</title>
    <link rel="stylesheet" href="../CSS/templatesLogin.css" />
  </head>
  <body>
    <div class="formulaire-login">
      <div class="divLogo">
        <img src="../images/fridge.png" alt="Logo site" class="logo" />
      </div>
      <h1>Frigo Anti-Gaspi</h1>
      <p class="WelcomeMessage">Créez votre compte</p>
      <hr />
      <form>
        <label>Nom et prénom</label>
        <input type="text" placeholder="Nom et prénom" required /><br />
        <label>Email</label>
        <input type="email" placeholder="Email" required /><br />
        <label>Mot de passe</label>
        <input type="password" placeholder="Mot de passe" required /><br />
        <label>Confirmez le mot de passe</label>
        <input type="password" placeholder="Confirmez votre mot de passe" required />
        <br />
        <button type="button" onclick="registrationUser()">S'inscrire</button>
        <p class="errorMessage" id="errorMsg" style="display:none;">Une erreur est survenue.</p>
      </form>
    </div>
    <footer>
      <p>&copy; Frigo Anti-Gaspi</p>
    </footer>

    <script>
      function registrationUser() {
        const donnee = document.querySelectorAll("input");
        const nom = donnee[0].value;
        const email = donnee[1].value;
        const password = donnee[2].value;
        const confirmPassword = donnee[3].value;

        if (!nom || !email || !password) {
          document.getElementById("errorMsg").textContent = "Veuillez remplir tous les champs.";
          document.getElementById("errorMsg").style.display = "block";
          return;
        }

        if (password !== confirmPassword) {
          document.getElementById("errorMsg").textContent = "Les mots de passe ne correspondent pas!";
          document.getElementById("errorMsg").style.display = "block";
          return;
        }

        fetch("http://localhost:5000/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nom, email, mot_de_passe: password }),
        })
        .then(res => res.json())
        .then(data => {
          if (data.message) {
            alert("Compte créé avec succès!");
            window.location.href = "login.html";
          } else {
            document.getElementById("errorMsg").textContent = data.error || "Une erreur est survenue.";
            document.getElementById("errorMsg").style.display = "block";
          }
        })
        .catch(() => {
          document.getElementById("errorMsg").textContent = "Impossible de contacter le serveur.";
          document.getElementById("errorMsg").style.display = "block";
        });
      }
    </script>
  </body>
</html>
