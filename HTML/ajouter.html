<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ajouter - Frigo Anti-Gaspi</title>
    <link rel="stylesheet" href="../CSS/styleControlPanel.css" />
  </head>
  <body>
    <header style="background-color: cadetblue;">
      <h2 align="center">MOINS DE GASPILLAGE, PLUS DE CONTROLE</h2>
      <p align="center">Gardez une trace de vos aliments, evitez le gaspillage et agissez pour la planete.</p>
      <div class="button-container">
        <a href="accueil.html"><button style="padding: 5px 10px; font-size: 16px;">Accueil</button></a>
        <a href="stock.html"><button style="padding: 5px 10px; font-size: 16px;">Stock</button></a>
        <a href="ajouter.html"><button style="padding: 5px 10px; font-size: 16px;">Ajouter</button></a>
        <a href="login.html"><button onclick="logout()" style="padding: 5px 10px; font-size: 16px;">Logout</button></a>
      </div>
      <hr>
    </header>
    <!--navigation entre les pages-->
    <div class="formulaire-login">
      <h1>Ajouter un produit</h1>
      <label>Nom du produit</label>
      <input id="nom" type="text" placeholder="ex: pain">
      <label>Date de péremption</label>
      <input id="date" type="date">
      <button onclick="ajouterProduit()">Ajouter</button>
    </div>
    <footer style="text-align: center;">
      <p>&copy; Frigo Anti-Gaspi</p>
    </footer>
    <script>
      //verif si utilisateur est connecte
      //si aucun token, redirection vers login
      if (!localStorage.getItem("token")) window.location.href = "login.html";
      //seuls les admins peuvent acceder
      if (localStorage.getItem("role") !== "admin") {
        alert("Accès refusé");
        window.location.href = "login.html";
      }
      function logout() {
        //suppression des données stockés, redirection vers login
        localStorage.removeItem("token");
        localStorage.removeItem("role");
        window.location.href = "login.html";
      }
      function ajouterProduit() {
        const nom = document.getElementById("nom").value;
        const date = document.getElementById("date").value;
        if (!nom || !date) {
          alert("Il faut compléter tous les champs !");
          return;
        }
        //envoi backend
        fetch("https://frigo-backend-u4vk.onrender.com/api/produits", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          //donnees envoye serveur
          body: JSON.stringify({ nom, quantite: 1, date_peremption: date })
        })
        .then(res => res.json())
        .then(() => {
          alert("Produit ajouté avec succès!");
          document.getElementById("nom").value = "";
          document.getElementById("date").value = "";
        })
        .catch(() => alert("Erreur lors de l'ajout."));
      }
    </script>
  </body>
</html>
