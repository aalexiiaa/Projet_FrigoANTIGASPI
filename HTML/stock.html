<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stock - Frigo Anti-Gaspi</title>
    <link rel="stylesheet" href="../CSS/styleControlPanel.css" />
  </head>
  <body>
    <header style="background-color: cadetblue;">
      <hr>
      <h2 align="center">MOINS DE GASPILLAGE, PLUS DE CONTROLE</h2>
      <p align="center">Gardez une trace de vos aliments, evitez le gaspillage et agissez pour la planete.</p>
      <div class="button-container">
        <a href="accueil.html"><button style="padding: 5px 10px; font-size: 16px;">Accueil</button></a>
        <a href="stock.html"><button style="padding: 5px 10px; font-size: 16px;">Stock</button></a>
        <a href="ajouter.html"><button style="padding: 5px 10px; font-size: 16px;">Ajouter</button></a>
        <a href="login.html"><button onclick="logout()" style="padding: 5px 10px; font-size: 16px;">Logout</button></a>
      </div>
      <hr>
    </header>
    <div class="contenuPrincipal">
      <h1>Stock</h1>
      <!--les produits son tstockées dynamiquement dasn le conteneur-->
      <div id="listeProduits"></div>
    </div>
    <footer style="text-align: center;">
      <p>&copy; Frigo Anti-Gaspi</p>
    </footer>
    <script>
      //verif si utilisateur connecte
      if (!localStorage.getItem("token")) window.location.href = "login.html";
      //verif du role
      if (localStorage.getItem("role") !== "admin") {
        alert("Accès refusé");
        window.location.href = "login.html";
      }
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("role");
        window.location.href = "login.html";
      }
      //fonction pour charger les produits depuis le backend
      function chProduit() {
        fetch("https://frigo-backend-u4vk.onrender.com/api/produits")
        .then(res => res.json())
        .then(produits => {
          //recuperation conteneur HTML
          const container = document.getElementById("listeProduits");
          //on vide le contenu avant de recharger
          container.innerHTML = "";
          produits.forEach(p => {
            const div = document.createElement("div");
            //atribution d'une classe selon le statut
            if (p.statut === "rouge") div.className = "product Red";
            else if (p.statut === "jaune") div.className = "product Orange";
            else div.className = "product Green";
            //insertion contenu HTML
            div.innerHTML = `<h3>${p.nom}</h3><p>Expiration: ${p.date_peremption}</p>`;
            //ajout dans DOM
            container.appendChild(div);
          });
        })
        .catch(() => alert("Erreur lors du chargement des produits."));
      }
      //apel fonction au chargement de la page
      chProduit();
    </script>
  </body>
</html>
