<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Accueil Frigo Anti-Gaspi</title>
    <link rel="stylesheet" href="../CSS/styleControlPanel.css" />
  </head>
  <body>
    <header style="background-color: cadetblue;">
      <hr>
      <h2 align="center">MOINS DE GASPILLAGE, PLUS DE CONTROLE</h2>
      <p align="center">Gardez une trace de vos aliments, evitez le gaspillage et agissez pour la planete.</p>
 
        <div class="button-container">
        <a href="accueil.html" id="b1" class="active">
            <button style="padding: 5px 10px; font-size: 16px;" id="f1">Accueil</button>
        </a>
        <a href="stock.html" id="b2">
            <button style="padding: 5px 10px; font-size: 16px;" id="f2">Stock</button>
        </a>
        <a href="ajouter.html" id="b3">
            <button style="padding: 5px 10px; font-size: 16px;" id="f3">Ajouter</button>
        </a>
        <a href="login.html" id="b4">
            <button style="padding: 5px 10px; font-size: 16px;" id="f4">Logout</button>
        </a>
      </div>
      <hr>
    </header>
    
    <div class="contenuPrincipal">
      <h1>Stock</h1>

      <div id="listeProduits"></div>
    </div>

    <script>
      function chProduit(){
        fetch("http://localhost:5000/api/produits")
        .then(res=>res.json())
        .then(produits=>{
          const container=document.getElementById("listeProduits");
          container.innerHTML="";
          produits.forEach(p=>{
            const div=document.createElement("div");

            //couleurs
            if (p.statut==="rouge") div.className="product Red";
            else if (p.statut==="jaune") div.className="product Orange";
            else div.className="product Green";

            div.innerHTML=`
              <h3>${p.nom}</h3>
              <p>${p.jours_restants} jours restants </p>
              <p>Expiration: ${p.date_expiration}</p>
            `;
            container.appendChild(div);
          })
        })
        .catch(err=>{
          console.error(err);
          alert("Erreur dans le chargement des produits");
        })
      }
      chProduit();
    </script>



    <footer style="text-align: center;">
      <p>&copy; Frigo Anti-Gaspi</p>
    </footer>
      
    </div>
  </body>
</html>
