<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>page_login</title>
    <link rel="stylesheet" href="templatesLogin.css" />
  </head>
  <body>
    <div class="formulaire-login">
      <!--Logo-->
      <div class="divLogo">
        <img src="images/fridge.png" alt="Logo site" class="logo">
      </div>
      <h1>Frigo Anti-Gaspi</h1>
      <p class="WelcomeMessage">Connectez-vous à votre compte</p>
      <hr />
      <!--formulaire pour se connecter-->
      <form>
        <label>Email </label>
        <input type="email" placeholder="Email" required />
        <label>Mot de passe</label>
        <input type="password" placeholder="Mot de passe" required />
        <br>
        <br>
        <button type="button" style="padding: 5px 10px; font-size: 16px;" id="f5">Login</button>
        <br>
        <br>
        <a href="signin.html">Sign in</a>
        <!--verifier si le mail et mot de passe sont correctes-->
        <p class="errorMessage">Email ou mot de passe incorrect</p>
      </form>
    </div>
    <footer>
      <p>&copy; Frigo Anti-Gaspi</p>
    </footer>
      
    </div>
  </body>
</html>
