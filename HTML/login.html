<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>page_login</title>
    <link rel="stylesheet" href="../CSS/templatesLogin.css" />
  </head>
  <body>
    <div class="formulaire-login">
      <!--Logo-->
      <div class="divLogo">
        <img src="../images/fridge.png" alt="Logo site" class="logo">
      </div>
      <h1>Frigo Anti-Gaspi</h1>
      <p class="WelcomeMessage">Connectez-vous à votre compte</p>
      <hr />
      <!--formulaire pour se connecter-->
      <form>
        <label>Email </label>
        <input type="email" placeholder="Email" required />
        <label>Mot de passe</label>
        <input type="password" placeholder="Mot de passe" required />
        <br>
        <br>
        <button type="button" onclick="logIn()" style="padding: 5px 10px; font-size: 16px;" id="f5">Login</button>
        <br>
        <br>
        <a href="signin.html">Sign in</a>
        <!--verifier si le mail et mot de passe sont correctes-->
        <p class="errorMessage">Email ou mot de passe incorrect</p>
      </form>
    </div>
    <footer>
      <p>&copy; Frigo Anti-Gaspi</p>
    </footer>
      
    </div>

    <script>
      function logIn(){
        const email=document.querySelector('input[type="email"]').value;
        const password=document.querySelector('input[type="password"]').value;

        fetch("http://localhost:5000/api/auth/login", {
          method:"POST",
          headers: {
            "Content-Type": "application/json"
          },
          body:JSON.stringify({
            email:email,
            mot_de_passe:password
          })
        })
        .then(res=> res.json())
        .then(data=> {
          if(data.token){
            //on sauvegarde token
            localStorage.setItem("token", data.token);
            localStorage.setItem("role", data.role);
            window.location.href="accueil.html";
          } else {
            document.querySelector(".errorMessage").style.display="block";
          }
        })
      }

      if (!localStorage.getItem("token")){
        window.location.href="login.html"
      }

    </script>
    


  </body>
</html>
