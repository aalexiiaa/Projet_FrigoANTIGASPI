<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>page_login</title>
    <link rel="stylesheet" href="../CSS/templatesLogin.css" />
  </head>
  <body>
    <div class="formulaire-login">
      <div class="divLogo">
        <img src="../images/fridge.png" alt="Logo site" class="logo">
      </div>
      <h1>Frigo Anti-Gaspi</h1>
      <p class="WelcomeMessage">Connectez-vous à votre compte</p>
      <hr />
      <form>
        <label>Email</label>
        <input type="email" id="email" placeholder="Email" required />
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="Mot de passe" required />
        <br><br>
        <button type="button" onclick="logIn()">Login</button>
        <br><br>
        <a href="signin.html">Pas encore de compte ? S'inscrire</a>
        <p class="errorMessage" id="errorMsg" style="display:none;">Email ou mot de passe incorrect</p>
      </form>
    </div>
    <footer>
      <p>&copy; Frigo Anti-Gaspi</p>
    </footer>
    <script>
      function logIn() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        if (!email || !password) {
          document.getElementById("errorMsg").textContent = "Veuillez remplir tous les champs.";
          document.getElementById("errorMsg").style.display = "block";
          return;
        }
        fetch("https://frigo-backend-u4vk.onrender.com/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, mot_de_passe: password })
        })
        .then(res => res.json())
        .then(data => {
          if (data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("role", data.role);
            window.location.href = "accueil.html";
          } else {
            document.getElementById("errorMsg").textContent = data.error || "Email ou mot de passe incorrect";
            document.getElementById("errorMsg").style.display = "block";
          }
        })
        .catch(() => {
          document.getElementById("errorMsg").textContent = "Impossible de contacter le serveur.";
          document.getElementById("errorMsg").style.display = "block";
        });
      }
    </script>
  </body>
</html>
