<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>page_login</title>
    <link rel="stylesheet" href="templatesLogin.css" />
  </head>
  <body>
    <div class="formulaire-login">
      <div class="divLogo">
        <img src="images/fridge.png" alt="Logo site" class="logo">
      </div>
      <h1>Frigo Anti-Gaspi</h1>
      <p class="WelcomeMessage">Connectez-vous à votre compte</p>
      <hr />
      <form>
        <label>Email </label>
        <input type="email" placeholder="Email" required /><br />
        <label>Password</label>
        <input type="password" placeholder="Password" required /><br />
        <button type="submit">Login</button>
        <br />
        <button type="button">Sign in</button>
        <p class="errorMessage">Email ou mot de passe incorrect</p>
      </form>
    </div>
    <footer>
      <p>&copy; Frigo Anti-Gaspi</p>
    </footer>
  </body>
</html>
